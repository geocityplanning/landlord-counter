<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>悬浮球图标候选</title>
<style>
  body{margin:0;background:#12202f;color:#edf5ff;font:20px/1.5 "PingFang SC",sans-serif;padding:28px}
  h2{font-size:26px;margin:0 0 18px}
  .row{display:flex;gap:26px;flex-wrap:wrap}
  .item{width:250px;background:rgba(255,255,255,.03);border:1px solid rgba(146,176,214,.25);
        border-radius:14px;padding:16px;text-align:center}
  .ball{width:110px;height:110px;border-radius:50%;margin:6px auto 10px;position:relative;
        background:linear-gradient(145deg,#3f5d84,#152438);border:2px solid rgba(146,176,214,.45);
        box-shadow:0 12px 26px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;
        font-size:52px;color:#fff}
  .ball.sm{width:56px;height:56px;font-size:26px;border-width:1px}
  .bd{position:absolute;top:-6px;right:-6px;background:#f4c76d;color:#111;border-radius:999px;
      font-size:15px;font-weight:900;padding:1px 9px}
  .nm{font-size:17px;color:#9fb4cc}
  svg{width:56px;height:56px}
  .ball.sm svg{width:28px;height:28px}
</style></head><body>
<h2>悬浮球图标候选（每个：大图 + 实际大小）</h2>
<div class="row">
  <div class="item"><span style="color:#9fb4cc">A · 现在(🃏)</span>
    <div class="ball">🃏<span class="bd">牌17</span></div>
    <div class="ball sm">🃏<span class="bd" style="font-size:11px">17</span></div>
  </div>
  <div class="item"><span style="color:#9fb4cc">B · "记"字(金)</span>
    <div class="ball" style="color:#f4c76d;font-weight:900">记<span class="bd">17</span></div>
    <div class="ball sm" style="color:#f4c76d;font-weight:900">记</div>
  </div>
  <div class="item"><span style="color:#9fb4cc">C · 卡片+闪光</span>
    <div class="ball"><svg viewBox="0 0 64 64"><g fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round">
      <rect x="10" y="18" width="30" height="40" rx="5" fill="rgba(255,255,255,.08)"/>
      <rect x="20" y="12" width="30" height="40" rx="5" fill="rgba(255,255,255,.14)"/></g>
      <path d="M52 10l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#ffd76a"/></svg><span class="bd">17</span></div>
    <div class="ball sm"><svg viewBox="0 0 64 64"><g fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round">
      <rect x="12" y="20" width="28" height="36" rx="5"/><rect x="24" y="14" width="28" height="36" rx="5"/></g></svg></div>
  </div>
  <div class="item"><span style="color:#9fb4cc">D · "AI"芯片</span>
    <div class="ball"><svg viewBox="0 0 64 64"><rect x="16" y="16" width="32" height="32" rx="7"
      fill="rgba(255,255,255,.10)" stroke="#fff" stroke-width="3.5"/>
      <text x="32" y="40" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">AI</text>
      <g stroke="#ffd76a" stroke-width="3.5" stroke-linecap="round">
      <path d="M24 10v6M32 10v6M40 10v6M24 48v6M32 48v6M40 48v6M10 24h6M10 32h6M10 40h6M48 24h6M48 32h6M48 40h6"/></g></svg><span class="bd">17</span></div>
    <div class="ball sm"><svg viewBox="0 0 64 64"><rect x="16" y="16" width="32" height="32" rx="7"
      fill="none" stroke="#fff" stroke-width="4.5"/><text x="32" y="41" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">AI</text></svg></div>
  </div>
  <div class="item"><span style="color:#9fb4cc">E · 卡片+放大镜(记牌)</span>
    <div class="ball"><svg viewBox="0 0 64 64"><rect x="10" y="14" width="26" height="36" rx="5"
      fill="rgba(255,255,255,.10)" stroke="#fff" stroke-width="3.5"/>
      <circle cx="40" cy="40" r="15" fill="rgba(255,215,106,.18)" stroke="#ffd76a" stroke-width="4"/>
      <path d="M51 51l9 9" stroke="#ffd76a" stroke-width="6" stroke-linecap="round"/></svg><span class="bd">17</span></div>
    <div class="ball sm"><svg viewBox="0 0 64 64"><rect x="8" y="12" width="26" height="38" rx="5"
      fill="none" stroke="#fff" stroke-width="4.5"/><circle cx="40" cy="40" r="15" fill="none" stroke="#ffd76a" stroke-width="5"/></svg></div>
  </div>
</div>
</body></html>
