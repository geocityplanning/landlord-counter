<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>掼蛋伴随 · 记牌助手</title>
<style>
  :root {
    --bg: rgba(10, 15, 24, 0.82);
    --panel: rgba(17, 25, 39, 0.9);
    --panel-2: rgba(25, 37, 52, 0.88);
    --card: rgba(31, 46, 63, 0.92);
    --card-2: rgba(42, 59, 81, 0.9);
    --line: rgba(146, 176, 214, 0.16);
    --fg: #edf5ff;
    --muted: #9bb0c9;
    --ok: #53d78a;
    --warn: #f4c76d;
    --mine: #68a7ff;
    --shadow: 0 18px 42px rgba(0, 0, 0, 0.45);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    /* ⚠ 页面内容全是 position:fixed(悬浮球+面板) ⇒ 不参与文档流 ⇒ body/html 高度=0
       ⇒ 写在这里的渐变"没地方画" ⇒ 露出浏览器默认白 ✗ (2026-09-21 实测)
       ⇒ 给个体面的最小高度, 渐变才铺得开 ✓ */
    min-height: 100vh;
    background: radial-gradient(circle at top, rgba(39, 64, 92, 0.8), rgba(6, 11, 18, 1) 50%);
    background-color: #060b12;        /* 兜底: 万一渐变也不算, 至少不是白 ✓ */
    color: var(--fg);
    font: 12px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  }

  /* ---------- 悬浮球(收起态) ---------- */
  #ball {
    position: fixed; right: 16px; bottom: 16px; width: 44px; height: 44px; border-radius: 50%;
    background: linear-gradient(145deg, rgba(49, 69, 92, 0.96), rgba(17, 27, 41, 0.96));
    display: none; align-items: center; justify-content: center; cursor: pointer;
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.42), inset 0 1px 0 rgba(255,255,255,0.1);
    border: 1px solid rgba(146, 176, 214, 0.26); z-index: 99;
    font-size: 18px; user-select: none; backdrop-filter: blur(12px);
    transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
  }
  #ball:hover {
    transform: translateY(-2px);
    border-color: rgba(104, 167, 255, 0.5);
    box-shadow: 0 13px 30px rgba(0, 0, 0, 0.48), inset 0 1px 0 rgba(255,255,255,0.14);
  }
  #ball .badge {
    position: absolute; top: -4px; right: -4px; background: var(--warn); color:#111;
    font-size: 10px; font-weight: 800; border-radius: 999px; min-width: 16px; height: 16px;
    line-height: 16px; padding: 0 4px; box-shadow: 0 5px 14px rgba(244, 199, 109, 0.35);
  }
  body.collapsed #ball { display: flex; }

  /* ---------- 主面板 ---------- */
  #panel {
    position: fixed; right: 16px; bottom: 16px; width: 320px;
    max-height: 82vh;                        /* 老浏览器兜底 */
    max-height: calc(100dvh - 24px);         /* 手机: 避开地址栏, 尽量多显示 ✓ */
    background: rgba(14, 20, 31, 0.86); border: 1px solid var(--line); border-radius: 15px;
    display: flex; flex-direction: column; box-shadow: var(--shadow); z-index: 98;
    overflow: hidden; backdrop-filter: blur(12px);
  }
  body.collapsed #panel { display: none; }
  header {
    display:flex; align-items:center; gap:6px; padding:8px 10px; background: linear-gradient(180deg, rgba(38, 54, 75, 0.95), rgba(21, 31, 45, 0.9));
    border-bottom: 1px solid var(--line); cursor: move;
  }
  header b { font-size: 13px; letter-spacing: 0.04em; }
  header .tag {
    background: rgba(255,255,255,0.04); border: 1px solid var(--line); color: var(--muted);
    border-radius: 7px; padding: 1px 6px; font-size: 10px;
  }
  header .sp { flex:1; }
  header button {
    background: rgba(255,255,255,0.03); color: var(--fg); border: 1px solid var(--line);
    border-radius: 7px; padding: 2px 7px; cursor: pointer; font-size: 11px;
  }
  .body {
    overflow-y: auto; padding: 9px; display:flex; flex-direction:column; gap: 8px;
  }
  section {
    background: rgba(255,255,255,0.02); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px;
  }
  section h3 {
    font-size: 10px; color: var(--muted); font-weight: 600; margin: 0 0 6px;
    display: flex; justify-content: space-between; letter-spacing: 0.08em; text-transform: uppercase;
  }

  /* 出牌记录（扁平滚动框） */
  .plays-box {
    max-height: 126px; overflow-y: auto; padding-right: 3px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .plays-box::-webkit-scrollbar { width: 5px; }
  .plays-box::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.12); border-radius: 999px;
  }
  .rec {
    display:flex; gap:5px; align-items:flex-start; padding: 3px 5px; border-radius: 6px;
    background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04);
  }
  .rec .who { color: var(--muted); min-width: 22px; font-weight: 600; }
  .rec.mine .who { color: var(--mine); }
  .rec .cs { display:flex; gap:3px; flex-wrap:wrap; align-items:center; }
  .c {
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
    border-radius: 4px; padding: 0 4px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .c.pass { color: var(--muted); border-style: dashed; }

  /* 牌池 */
  .pool { display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:4px; }
  .pcell {
    background: rgba(255,255,255,0.02); border: 1px solid var(--line); border-radius: 6px;
    padding: 4px 3px; text-align:center; font-family: ui-monospace,monospace; min-height: 43px;
  }
  .pcell .k { color: var(--muted); font-size: 10px; }
  .pcell .v { font-size: 14px; font-weight: 700; margin-top: 1px; }
  .pcell.z {
    background: linear-gradient(180deg, rgba(83, 215, 138, 0.12), rgba(14, 27, 24, 0.9));
    border-color: rgba(83, 215, 138, 0.3);
  }
  .pcell.z .v { color: var(--ok); }

  /* 推荐 / 托管 */
  .recs-box { display:flex; flex-direction:column; gap:6px; }
  .rec-row {
    background: rgba(255,255,255,0.02); border: 1px solid var(--line); border-radius: 7px;
    padding: 5px 7px; display:flex; justify-content:space-between; align-items:center; gap:6px;
  }
  .rec-row .main { flex:1; min-width:0; }
  .rec-row .n { color: var(--muted); font-size: 10px; white-space: nowrap; }
    #host { width:100%; padding:8px 10px; border:1px solid rgba(255,255,255,0.08); border-radius:8px;
      font-size:13px; font-weight:700; cursor:pointer; background: linear-gradient(180deg, #1b2a3c, #172334); color: var(--fg); }
  #host.on { background: linear-gradient(180deg, rgba(83,215,138,0.2), rgba(35,90,60,0.9)); border-color: rgba(83,215,138,0.38); color: #eafff3; }
  footer {
    padding: 6px 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 10px;
    display:none;
  }

  @media (max-width: 420px) {
    #panel {
      width: min(90vw, 310px);
      right: 8px; bottom: 8px;
    }
    .body { padding: 8px; }
    section { padding: 7px; }
  }
</style>
</head>
<body>

<!-- 悬浮球 -->
  <div id="ball" onclick="toggleBall()" title="当前手牌：–张">🃏<span class="badge" id="ballBadge">牌–</span></div>

<!-- 主面板 -->
<div id="panel">
  <header>
    <b>记牌助手</b>
    <span class="tag" id="gid">–</span>
    <span class="tag" id="ji">级牌 –</span>
    <span class="sp"></span>
    <button onclick="toggleBall()" title="收起成悬浮球">—</button>
  </header>

  <div class="body">
    <section><h3>出牌记录 <span id="playCount"></span></h3><div class="plays-box" id="plays"></div></section>
    <section><h3>牌池 <span id="poolHint">剩余张数</span></h3><div class="pool" id="pool"></div></section>
    <section><h3>出牌推荐 <span id="recHint"></span></h3><div id="recs"></div></section>
    <section><button id="host" onclick="toggleHost()">AI 托管：关</button></section>
  </div>
  <footer><span id="acc">准确率 –</span><span id="updated">–</span></footer>
</div>

<script>
const ZHI = {11:'J',12:'Q',13:'K',14:'A',15:'小王',16:'大王'};
const HUA = {0:'♠',1:'♥',2:'♣',3:'♦',4:''};
const cname = c => (c.hua===4 ? '' : (HUA[c.hua]||'')) + (ZHI[c.zhi] || c.zhi);

function toggleBall(){
  document.body.classList.toggle('collapsed');
  localStorage.setItem('ball', document.body.classList.contains('collapsed') ? '1' : '0');
}
if (localStorage.getItem('ball') === '1') document.body.classList.add('collapsed');

/* ---------- 拉数据(2 秒一次; 悬浮球收起时也拉, 让角标还活着 ✓) ---------- */
async function tick(){
  try {
    const j = await (await fetch('/api/live')).json();
    if (j.empty) { document.getElementById('gid').textContent = '等待牌局'; return; }
    render(j);
    const a = await (await fetch('/api/accuracy')).json();
    document.getElementById('acc').textContent =
      a.verified ? `准确率 ${a.agree}/${a.verified} = ${(a.accuracy*100).toFixed(1)}%` : '准确率 暂无数据';
  } catch (e) { document.getElementById('updated').textContent = '连接失败'; }
}

function render(j){
  document.getElementById('gid').textContent = j.gid;
  document.getElementById('ji').textContent  = '级牌 ' + (ZHI[j.ji_pai] || (j.ji_pai||'–'));
  const handCount = (j.hand || []).length;
  document.getElementById('ballBadge').textContent = `牌${handCount}`;
  document.getElementById('ball').title = `当前手牌：${handCount}张`;
  document.getElementById('updated').textContent = new Date().toLocaleTimeString();

  // 出牌记录(最近 12 手，扁平滚动框)
  const ps = (j.plays||[]).slice(-12);
  document.getElementById('playCount').textContent = `${(j.plays||[]).length} 手`;
  document.getElementById('plays').innerHTML = ps.map(p => `
    <div class="rec ${p.mine?'mine':''}">
      <span class="who">${p.mine ? '我' : p.seat}</span>
      <span class="cs">${p.kind==='pass'
        ? '<span class="c pass">不出</span>'
        : (p.cards||[]).map(c => `<span class="c">${cname(c)}</span>`).join('')}</span>
    </div>`).join('') || '<div class="n" style="color:#8b98a9">还没有记录</div>';

  // ② 牌池(取最新一张快照 ✓ 数据来自 CardTracker.remaining_counts, 前端只显示 ✓)
  const rem = (j.remains && j.remains[0]) ? j.remains[0].counts : {};
  const order = [16,15,14,13,12,11,10,9,8,7,6,5,4,3,2];
  document.getElementById('pool').innerHTML = order.map(k => {
    const v = rem[k] ?? rem[String(k)];
    if (v === undefined) return '';
    return `<div class="pcell ${v===0?'z':''}"><div class="k">${ZHI[k]||k}</div><div class="v">${v}</div></div>`;
  }).join('') || '<div style="color:#8b98a9">还没有快照</div>';

  // ③ 出牌推荐: 最近 3 条决策(显示**后端真有的**字段: 候选数 + 对账是否一致 ✓)
  //    ⚠ 2026-09-21: 之前读 d.score 排序 ⇒ 后端没这字段 ⇒ 全 0 且显示 "0.0分" ✗ 已改回
  const ds = (j.decisions||[]).slice(0, 3);
  document.getElementById('recHint').textContent =
    `${ds.length} 条 · ${ds.some(d=>d.need_beat)?'需压':'领出'}`;
  document.getElementById('recs').innerHTML = ds.map((d,i) => `
    <div class="rec-row">
      <div class="main">${i + 1}. ${(d.chosen||[]).map(c=>cname(c)).join(' ') || '不出'}</div>
      <span class="n">${d.cand_n ?? '–'}候选 · ${d.agree===1?'✓一致':(d.agree===0?'✗不一致':'未验')}</span>
    </div>`).join('') || '<div style="color:#8b98a9">还没有决策</div>';

  // ④ 托管按钮(只写"意图" ✓ 执行归现有托管循环 ✓)
  const b = document.getElementById('host');
  b.textContent = j.host ? 'AI 托管：开' : 'AI 托管：关';
  b.classList.toggle('on', !!j.host);
}

async function toggleHost(){
  const b = document.getElementById('host');
  const want = !b.classList.contains('on');
  await fetch('/api/host', {method:'POST', headers:{'Content-Type':'application/json'},
                            body: JSON.stringify({on: want})});
  tick();
}

tick();
setInterval(tick, 2000);
</script>
</body>
</html>
